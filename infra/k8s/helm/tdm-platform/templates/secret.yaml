# Secret TEMPLATE for the control plane's database credentials.
#
# Phase 12 scope: this is a structurally real Secret manifest, not a
# committed real credential (see SECURITY.md and
# infra/terraform/README.md's identical "never a real value" rule). It
# renders only when `controlPlane.dbSecret.create` is true, which
# defaults to false -- the intended real-deployment path is an
# *externally* managed Secret with the same name
# (`controlPlane.databaseSecretName`, values.yaml), populated by a
# platform team's secret pipeline (Azure Key Vault Provider for Secrets
# Store CSI Driver, External Secrets Operator, or a sealed-secrets
# controller), never templated in cleartext by this chart. See
# docs/AZURE_PRODUCTION_DEPLOYMENT.md for the Azure-specific mechanism.
# `controlPlane.dbSecret.create: true` exists only for local `helm
# install` demos/dev clusters where no external secret pipeline exists.
{{- if .Values.controlPlane.dbSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.controlPlane.databaseSecretName }}
  labels:
    {{- include "tdm-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
type: Opaque
stringData:
  TDM_CONTROL_PLANE_DATABASE_URL: {{ .Values.controlPlane.dbSecret.databaseUrl | quote }}
  TDM_CONTROL_PLANE_LIFECYCLE_DATABASE_URL: {{ .Values.controlPlane.dbSecret.lifecycleDatabaseUrl | quote }}
{{- end }}
