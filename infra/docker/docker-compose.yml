# Local development infrastructure for the enterprise healthcare test data
# management platform.
#
# Brings up the metadata plane (PostgreSQL) and local object storage
# (MinIO, S3-API-compatible — see docs/adr/0005-object-storage-abstraction.md).
# Application services (control-plane, data-plane, governance-service,
# frontend) are intentionally NOT included here yet — they have no real
# behavior until later phases, so there is nothing meaningful to
# containerize for them yet (see ROADMAP.md).
#
# All credentials below are obvious local-development-only placeholders,
# never used outside a developer's own machine. See SECURITY.md.
#
# Usage: docker compose -f infra/docker/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: tdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tdm
      POSTGRES_PASSWORD: tdm_local_dev_only
      POSTGRES_DB: tdm_metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdm -d tdm_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tdm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tdm_minio_admin
      MINIO_ROOT_PASSWORD: tdm_local_dev_only
    ports:
      - "9000:9000" # S3-compatible API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
