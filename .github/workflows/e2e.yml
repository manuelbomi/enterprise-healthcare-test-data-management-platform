name: Playwright E2E

# Runs the real Phase 9 Playwright specs (frontend/e2e/*.spec.ts)
# against a REAL control-plane (uvicorn) and a REAL Vite dev server —
# never a mock backend, per frontend/playwright.config.ts's own header
# comment and CONTRIBUTING.md's testing conventions. This workflow is
# the CI-runner version of that file's documented three-step manual
# startup sequence.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E (control-plane + frontend, real processes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Python workspace
        run: bash scripts/bootstrap.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Generate real demo data (Phase 9 fixture script)
        run: python scripts/demo_phase9_console_data.py

      - name: Start control-plane (background, port 8010)
        # Deliberately NOT `working-directory: services/control-plane`
        # (a real bug found and fixed while verifying this workflow --
        # see problems_phase_12.md): control_plane.config.Settings'
        # default paths (catalog_path, lifecycle_database_url, the
        # Phase 9 artifact roots) are plain relative strings resolved
        # against the process's cwd, not the package's location --
        # `pip install -e .` makes `control_plane` importable from any
        # cwd, but running uvicorn from services/control-plane would
        # resolve those defaults under services/control-plane/data/tmp/...
        # instead of the repo-root data/tmp/... the demo data step
        # above just wrote to, leaving the API serving an empty
        # catalog/lifecycle DB and every data-dependent Playwright spec
        # failing. Running from the repo root (this job's default cwd)
        # keeps both steps' relative paths consistent.
        #
        # TDM_CONTROL_PLANE_CORS_ALLOWED_ORIGINS is required here (a
        # second real bug found while verifying this workflow -- the
        # cwd fix above was necessary but not sufficient): the frontend
        # is started below with VITE_API_BASE_URL=http://127.0.0.1:8010
        # set, which per frontend/src/api/client.ts makes every API
        # call an ABSOLUTE, cross-origin fetch from the browser
        # (127.0.0.1:5174 -> 127.0.0.1:8010) -- a genuinely different
        # origin, not the same-origin-via-Vite-proxy default
        # ADR-0008/config.py describe. Without this, the control plane
        # installs no CORS middleware at all (config.py's documented,
        # strictest default) and Chromium silently blocks every
        # response, which is indistinguishable from "no data" in the
        # UI -- exactly the symptom that made the earlier cwd fix look
        # ineffective. See problems_phase_12.md.
        env:
          TDM_CONTROL_PLANE_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5174"
        run: |
          nohup uvicorn control_plane.main:app --host 127.0.0.1 --port 8010 \
            > "${{ runner.temp }}/control-plane.log" 2>&1 &
          echo $! > "${{ runner.temp }}/control-plane.pid"
      - name: Wait for control-plane
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8010/api/v1/health > /dev/null; then
              echo "control-plane is up."
              exit 0
            fi
            sleep 1
          done
          echo "::error::control-plane never became healthy"
          cat "${{ runner.temp }}/control-plane.log" || true
          exit 1

      - name: Start frontend dev server (background, port 5174)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: "http://127.0.0.1:8010"
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5174 > "${{ runner.temp }}/frontend.log" 2>&1 &
          echo $! > "${{ runner.temp }}/frontend.pid"
      - name: Wait for frontend
        # The REAL root cause of two real failed CI runs here (not cold
        # start, as an earlier fix attempt guessed): Vite's default
        # `server.host: false` resolves "localhost" per the runner's
        # OS/Node resolver order, which bound the dev server to `::1`
        # (IPv6) only -- `curl http://127.0.0.1:5174/` (IPv4) then
        # fails for the *entire* wait budget every time, regardless of
        # how long the budget is, because it is a routing mismatch, not
        # a timing race (Vite's own log always showed "ready in
        # ~200ms", immediately, in every failed run). Fixed by passing
        # `--host 127.0.0.1` explicitly above, forcing IPv4 binding
        # that matches this curl check. See problems_phase_12.md for
        # both real failed run URLs and this diagnosis.
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5174/ > /dev/null; then
              echo "frontend is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::frontend dev server never became reachable"
          cat "${{ runner.temp }}/frontend.log" || true
          exit 1

      - name: Run Playwright E2E specs
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5174"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Stop background processes
        if: always()
        run: |
          kill "$(cat "${{ runner.temp }}/control-plane.pid")" 2>/dev/null || true
          kill "$(cat "${{ runner.temp }}/frontend.pid")" 2>/dev/null || true
