name: Production Promotion

# Final promotion gate — only runs after Staging/UAT Promotion succeeds
# (real `workflow_run` dependency, same chain as deploy-qa.yml ->
# deploy-staging-uat.yml -> this file). The `production` GitHub
# Environment below can carry required-reviewer protection rules
# (configured in this repository's Settings -> Environments ->
# production — see docs/AZURE_PRODUCTION_DEPLOYMENT.md and
# problems_phase_12.md for whether that protection is configured in
# this repository and how it was verified); when configured, this job
# genuinely pauses for a human approval in the Actions UI before it
# runs, which is the real mechanism GitHub Environments provide for a
# manual production gate — nothing here fakes that pause.
#
# As with every other stage, "deploy" is a Docker Compose stand-in with
# real health checks — no real cloud target or credentials exist in
# this repository. A real production deployment would instead apply
# infra/terraform/azure (or infra/k8s/helm/tdm-platform against a real
# AKS cluster) — see docs/AZURE_PRODUCTION_DEPLOYMENT.md.

on:
  workflow_run:
    workflows: ["Staging/UAT Promotion"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Check staging/UAT promotion succeeded
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Gate open
        run: echo "Staging/UAT promotion succeeded (or manual dispatch) — proceeding to production."

  deploy-production:
    name: Deploy to production (Docker Compose stand-in) + smoke test
    runs-on: ubuntu-latest
    needs: gate
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Bring up the production stand-in stack
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d --build \
            postgres control-plane governance-service frontend

      - name: Wait for control-plane readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::control-plane never became ready"
          docker compose -f infra/docker/docker-compose.yml logs
          exit 1

      - name: Production smoke test
        run: |
          curl -sf http://127.0.0.1:8000/api/v1/health
          curl -sf http://127.0.0.1:8000/api/v1/ready
          curl -sf http://127.0.0.1:8001/health
          curl -sf http://127.0.0.1:8080/ > /dev/null
          echo "Production smoke test passed."

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
