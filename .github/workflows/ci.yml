name: CI

# Phase 0 status: this workflow has not yet run against this repository
# (no GitHub remote/Actions run exists yet — see problems_master.md P0-2).
# It is written to be correct against the package layout established in
# Phase 0 (ADR-0002) so that Phase 1 onward can add real jobs/steps
# incrementally without restructuring the pipeline. A package with no
# tests yet still gets a job here (see CONTRIBUTING.md's testing
# conventions) so CI coverage grows automatically as phases land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python — libs/contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: pip install -e "libs/contracts[dev]"
      - name: Lint (ruff)
        run: ruff check libs/contracts/src libs/contracts/tests
      - name: Test (pytest)
        run: pytest libs/contracts/tests

  control-plane:
    name: Python — services/control-plane
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          pip install -e "libs/contracts"
          pip install -e "services/control-plane[dev]"
      - name: Lint (ruff)
        run: ruff check services/control-plane/src services/control-plane/tests
      - name: Test (pytest)
        run: pytest services/control-plane/tests

  data-plane:
    name: Python — services/data-plane
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          pip install -e "libs/contracts"
          pip install -e "services/data-plane[dev]"
      - name: Lint (ruff)
        run: ruff check services/data-plane/src services/data-plane/tests
      - name: Test (pytest)
        run: pytest services/data-plane/tests

  governance-service:
    name: Python — services/governance-service
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          pip install -e "libs/contracts"
          pip install -e "services/governance-service[dev]"
      - name: Lint (ruff)
        run: ruff check services/governance-service/src services/governance-service/tests
      - name: Test (pytest)
        run: pytest services/governance-service/tests

  frontend:
    name: Frontend — lint, typecheck, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: npm run test

  # Data-quality and Playwright E2E jobs are added in Phase 19, once there
  # are real data-plane jobs and UI screens to exercise them against.
