name: Container build & scan

# Builds the three real Dockerfiles this repository has as of Phase 12
# (services/control-plane/Dockerfile, services/governance-service/Dockerfile,
# frontend/Dockerfile — see each file's header comment) and runs a
# vulnerability scan (Trivy) against each built image. Never pushes to
# any registry — build+scan only, no real registry credentials exist in
# this repository (see infra/terraform/README.md and SECURITY.md).
#
# data-plane is deliberately not built here — see problems_phase_12.md
# for the decision record (PySpark/pandas batch/CLI toolkit, not a
# long-running containerized service, as of this phase).
#
# The Trivy step fails the job on a CRITICAL finding (treated, along
# with scripts/security/detect_secrets.py and dependency_scan.py in
# ci.yml, as this platform's "critical security validation" release
# gate — ROADMAP.md Phase 12), and is non-blocking (report-only) for
# HIGH/MEDIUM/LOW so a base-image CVE with no fix yet doesn't stall
# every release; see problems_phase_12.md for what was actually found
# the first time this ran.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build & scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: control-plane
            image: tdm-control-plane
            context: .
            dockerfile: services/control-plane/Dockerfile
          - service: governance-service
            image: tdm-governance-service
            context: .
            dockerfile: services/governance-service/Dockerfile
          - service: frontend
            image: tdm-console
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — no registry credentials in this repo)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Container smoke test (image actually runs and answers its health endpoint)
        run: |
          set -euo pipefail
          case "${{ matrix.service }}" in
            control-plane)
              docker run -d --name smoke --rm -p 18000:8000 ${{ matrix.image }}:ci-${{ github.sha }}
              url="http://127.0.0.1:18000/api/v1/health"
              ;;
            governance-service)
              docker run -d --name smoke --rm -p 18001:8001 ${{ matrix.image }}:ci-${{ github.sha }}
              url="http://127.0.0.1:18001/health"
              ;;
            frontend)
              docker run -d --name smoke --rm -p 18080:8080 ${{ matrix.image }}:ci-${{ github.sha }}
              url="http://127.0.0.1:18080/"
              ;;
          esac
          for i in $(seq 1 15); do
            if curl -sf "$url" > /dev/null; then
              echo "Smoke test passed: $url"
              docker stop smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::Smoke test FAILED: $url never became reachable"
          docker logs smoke || true
          docker stop smoke || true
          exit 1

      - name: Trivy vulnerability scan (report all severities)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:ci-${{ github.sha }}
          format: table
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Trivy vulnerability scan (fail on CRITICAL — release gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:ci-${{ github.sha }}
          format: table
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
