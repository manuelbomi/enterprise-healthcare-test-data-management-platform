[build-system]
requires = ["setuptools>=83.0.0", "wheel"]  # PYSEC-2026-3447, fixed in 83.0.0
build-backend = "setuptools.build_meta"

[project]
name = "tdm-governance-service"
version = "0.2.0"
description = "Security/governance plane: RBAC, immutable audit events, secrets provider adapter, and certification evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "healthcare-tdm-contracts",  # workspace-local: installed via scripts/bootstrap-dev (see README)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.9",
    "ruff==0.5.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
