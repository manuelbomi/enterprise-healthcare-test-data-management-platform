[alembic]
# services/control-plane/alembic.ini -- Phase 18A (resolves
# problems_final_review.md P1-3: "no schema-migration framework exists
# for the control-plane's real, evolving database").
#
# `script_location` points at ./migrations (this service's own
# migration history -- never shared with data-plane/governance-service,
# each of which would get its own if it ever grew a real schema).
#
# `sqlalchemy.url` below is a placeholder ONLY. `migrations/env.py`
# always resolves the real URL from `control_plane.config.get_settings()`
# (the same `TDM_CONTROL_PLANE_LIFECYCLE_DATABASE_URL` environment
# variable the running application itself uses) unless overridden with
# `-x db_url=<url>` on the alembic CLI -- so `alembic upgrade head`
# always targets the same database the application would connect to,
# never a second, out-of-sync URL hardcoded in this file.
script_location = migrations
sqlalchemy.url = sqlite:///data/tmp/control-plane/lifecycle.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
