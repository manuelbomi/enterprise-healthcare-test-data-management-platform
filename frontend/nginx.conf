# nginx config for the containerized TDM console (see Dockerfile).
#
# Two responsibilities:
#   1. Serve the built React SPA, falling back to index.html for any
#      path that isn't a real static file (client-side routing via
#      react-router-dom -- ARCHITECTURE.md section 2.5).
#   2. Proxy /api/* to the control plane, so the container needs no
#      CORS configuration on either side (ADR-0008's same-origin
#      default, reproduced here the same way vite.config.ts's dev-time
#      proxy does it). "control-plane" is the Docker Compose service
#      name in infra/docker/docker-compose.yml -- this file is the
#      Compose/local-container wiring. A real Kubernetes deployment
#      instead routes /api through an Ingress/Gateway to the
#      control-plane Service (see infra/k8s/helm/tdm-platform/templates/
#      ingress.yaml), so this proxy_pass target is not used there.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Resolving via a variable (rather
    # than a bare proxy_pass hostname) defers DNS lookup to request
    # time instead of nginx startup/config-load time -- this container
    # then still starts cleanly (and serves static assets) even when
    # run standalone, outside Docker Compose, where "control-plane"
    # does not resolve at all (a real nginx `host not found in
    # upstream` startup crash hit and fixed while verifying this image
    # in Phase 12 -- see docs/problems/problems_phase_12.md).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # Using $request_uri (the full, unmodified original URI) rather
        # than relying on nginx's automatic location-prefix rewrite --
        # that rewrite is documented to NOT happen when proxy_pass's
        # target host comes from a variable (needed above for deferred
        # DNS resolution), a real bug hit and fixed while verifying this
        # image in Phase 12: an unqualified `proxy_pass
        # http://$upstream/api/;` silently forwarded only the literal
        # "/api/" path to the backend instead of e.g. "/api/v1/health"
        # (control-plane's real routes are already mounted at
        # `/api/v1/...`, so no prefix stripping is needed or wanted
        # here). See docs/problems/problems_phase_12.md.
        set $control_plane_upstream "control-plane:8000";
        proxy_pass http://$control_plane_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
